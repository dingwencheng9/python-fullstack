# 数据工程 - 虚拟容器
# 不含 [build-system]，不是可安装包

[project]
name = "stage5-data-engineering"
version = "0.1.0"
description = "Python 3.13 全栈课程 - 数据工程"
requires-python = ">=3.13"

# 依赖从根 pyproject.toml 继承
dependencies = []

# 仅工具配置，无 [build-system]（stage 是虚拟容器）

[tool.ruff]
target-version = "py313"
line-length = 150

[tool.ruff.lint.per-file-ignores]
# 教学示例使用教学对比代码，需要宽松规则
"lessons/**/*.py" = ["E501", "E402", "E731", "UP035", "UP040", "F401", "F821"]
# 测试文件使用教学对比代码
"**/tests/*.py" = ["N806", "E721", "E402", "F821"]

[tool.mypy]
python_version = "3.13"
strict = false
