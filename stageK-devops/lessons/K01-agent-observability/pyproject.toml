[project]
name = "K01-agent-observability"
version = "1.0.0"
description = "K01 AI Agent 部署与可观测性"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py313"
line-length = 100
