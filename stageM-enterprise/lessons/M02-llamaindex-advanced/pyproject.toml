[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--tb=short"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
ignore = ["E402", "F841", "N802", "N806"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
