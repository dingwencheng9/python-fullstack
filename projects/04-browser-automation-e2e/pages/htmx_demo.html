<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>HTMX Demo</title>
    <script src="https://unpkg.com/htmx.org@2"></script>
  </head>
  <body>
    <main>
      <h1>HTMX 搜索演示</h1>
      <section id="search-section">
        <label for="search-input">搜索课程</label>
        <input
          id="search-input"
          name="q"
          type="search"
          placeholder="输入 FastAPI / Agent / DuckDB"
          hx-get="/search"
          hx-trigger="input changed delay:300ms"
          hx-target="#search-results"
          hx-indicator="#search-spinner"
        />
        <span id="search-spinner" class="htmx-indicator">搜索中...</span>
        <div id="search-results" aria-live="polite"></div>
      </section>

      <section id="add-section">
        <h2>添加条目</h2>
        <form
          id="add-form"
          hx-post="/items"
          hx-target="#item-list"
          hx-swap="beforeend"
        >
          <input id="item-name" name="name" required placeholder="条目名称" />
          <button type="submit">添加</button>
        </form>
        <ul id="item-list"></ul>
      </section>
    </main>
  </body>
</html>
