# ==============================================================================
# Nginx Reverse Proxy Configuration for AI Fullstack Capstone
# ==============================================================================
# Purpose: TLS termination, rate limiting, and upstream load balancing

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # 性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # ==============================================================================
    # Rate Limiting Zones
    # ==============================================================================
    # API 端点速率限制（每秒 10 个请求）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # 严格速率限制（用于敏感端点，每秒 2 个请求）
    limit_req_zone $binary_remote_addr zone=strict_limit:10m rate=2r/s;

    # ==============================================================================
    # Upstream Configuration
    # ==============================================================================
    upstream fastapi_backend {
        # FastAPI 应用后端（Docker Compose 服务名）
        server app:8000 max_fails=3 fail_timeout=30s;

        # 保持连接池
        keepalive 32;
    }

    # ==============================================================================
    # HTTP Server (Redirect to HTTPS)
    # ==============================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # HTTP 健康检查端点（不重定向）
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # 其他所有 HTTP 流量重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==============================================================================
    # HTTPS Server (Production)
    # ==============================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;

        # TLS 配置（生产环境需替换为真实证书）
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # TLS 协议和加密套件（现代化配置）
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;

        # TLS 会话缓存
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # 客户端上传大小限制
        client_max_body_size 10M;

        # ==============================================================================
        # Health Check Endpoint (No Rate Limit)
        # ==============================================================================
        location /health {
            access_log off;
            proxy_pass http://fastapi_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ==============================================================================
        # API Endpoints (Standard Rate Limit: 10 req/s)
        # ==============================================================================
        location /documents {
            # 应用标准速率限制
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # 反向代理配置
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 请求头转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 禁用缓冲（适用于 SSE 流式响应）
            proxy_buffering off;
            proxy_cache off;
        }

        # ==============================================================================
        # Chat Endpoint (Strict Rate Limit: 2 req/s)
        # ==============================================================================
        # 保护 LLM API token 配额，防止滥用
        location /chat {
            # 严格速率限制（保护 LLM API 配额）
            limit_req zone=strict_limit burst=5 nodelay;
            limit_req_status 429;

            # 反向代理配置
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            # 超时配置（LLM 响应可能较慢）
            proxy_connect_timeout 60s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;

            # 请求头转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 禁用缓冲（SSE 流式响应）
            proxy_buffering off;
            proxy_cache off;

            # SSE 特殊配置
            proxy_set_header Accept "text/event-stream";
            chunked_transfer_encoding on;
        }

        # ==============================================================================
        # Root and Other Endpoints (Standard Rate Limit)
        # ==============================================================================
        location / {
            # 应用标准速率限制
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            # 反向代理配置
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;

            # 超时配置
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # 请求头转发
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # 禁用缓冲
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
