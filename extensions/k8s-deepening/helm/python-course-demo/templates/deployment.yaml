apiVersion: apps/v1
kind: Deployment
metadata:
  name: { { include "python-course-demo.fullname" . } }
  namespace: { { .Values.namespace.name } }
  labels: { { - include "python-course-demo.labels" . | nindent 4 } }
spec:
  replicas: { { .Values.replicaCount } }
  selector:
    matchLabels:
      { { - include "python-course-demo.selectorLabels" . | nindent 6 } }
  template:
    metadata:
      labels:
        { { - include "python-course-demo.selectorLabels" . | nindent 8 } }
    spec:
      containers:
        - name: { { .Chart.Name } }
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: { { .Values.image.pullPolicy } }
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources: { { - toYaml .Values.resources | nindent 12 } }
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
