apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-course-demo
  namespace: python-course-demo
  labels:
    app.kubernetes.io/name: python-course-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: python-course-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: python-course-demo
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
