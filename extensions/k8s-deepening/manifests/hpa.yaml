apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: python-course-demo
  namespace: python-course-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: python-course-demo
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
