    "E721",    # 教学保留 type == 比较（演示反模式）
    "UP028",   # 教学保留 yield from 旧写法对照
    "B011",    # 教学保留 assert False（演示反模式）
    "B018",    # 教学保留无用表达式（演示运行时不报错）
    "B006",    # 教学保留可变默认参数（演示常见陷阱）
    "B023",    # 教学保留闭包绑定问题示例
    "PLR0133", # 教学保留常量比较（演示）
    "PLW1641", # 教学保留无 __hash__（演示）
    "PT015",   # 教学保留 assert False
    "PT019",   # 教学保留特殊 fixture 命名
    "PTH110",  # 教学保留 os.path.exists()
    "RET503",  # 教学保留隐式 None 返回
    "RUF005",  # 教学保留显式列表拼接
    "RUF100",  # 教学保留 noqa 注释（即使规则未启用）
    "SIM115",  # 教学保留无 with 的 open()（演示）
    "SIM118",  # 教学保留 dict.keys() 显式
    "TRY002",  # 教学保留 raise Exception() 通用形式
    "F403",    # 教学保留 from X import * 模式
    "F823",    # 教学保留 LEGB 演示中的 NameError
    "N816",    # 教学保留 mixedCase 演示
    "PLW0602", # 教学保留 global 但无赋值（演示）
    "PLW2901", # 教学保留循环变量重写
    "PT018",   # 教学保留 assert a and b（不强求拆分）
    "TRY004",  # 教学保留 raise ValueError 而非 TypeError
]

# 🔥 核心源代码严格模式（不允许类型豁免）
"stage*/projects/**/src/**/*.py" = []  # P1等项目核心代码必须有完整类型提示

# 自动修复配置
fixable = ["ALL"]
unfixable = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# isort配置
[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["stage1", "stage2", "stage3", "stage4"]

# ============================================================================
# Mypy 配置 - 类型检查防线
# 🎯 python_version = "3.13" - 类型检查锁定Python 3.13
# ============================================================================

[tool.mypy]
# ============================================================================
# Mypy 配置说明
# ----------------------------------------------------------------------------
# - 课程基线：Python 3.13；目标只对"工程代码"启用 strict（projects/、
#   extensions/<lib>/src/、stage*/core/ 等）；教学代码（lessons/<>/solutions /
#   exercises / examples / tests / 等）通过 exclude 路径模式整体豁免。
# - `uv run mypy .` 当前 0 错误（39 source files），CI 中作为门禁。
# - FastAPI 路由的 untyped-decorator 通过文件级 `# mypy: disable-error-code`
#   关闭（上游已知 quirk），其他 strict 规则保留。
# ============================================================================
python_version = "3.13"  # 🔑 关键：类型检查锁定 Python 3.13

# 🚨 Strict模式 - 最严格类型安全
strict = true
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
disallow_untyped_defs = true
# 关闭 disallow_any_unimported：本仓库大量使用无类型 stub 的第三方库
# （pandas 旧 stub、langgraph、httpx-related 等），强制此项会让 projects/
# 工程代码淹没在 [no-any-unimported] 警告里。仍保留 ignore_missing_imports
# 给具体已知库提供豁免（见下方 overrides）。
disallow_any_unimported = false
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
strict_equality = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
strict_concatenate = true

# 🔥 死代码检测（必须）
warn_unreachable = true
warn_no_return = true

# 🔥 Any 泄露检测
disallow_any_expr = false  # 项目根目录设为 false，子模块可覆盖

# 🔥 Python 3.12+ 特性启用
enable_error_code = [
    "explicit-override",      # 强制 @override 装饰器
    "ignore-without-code",    # 禁止裸 # type: ignore
    "redundant-expr",         # 冗余表达式
    "truthy-bool",            # bool 类型判断
    "truthy-iterable",        # 可迭代对象判断
    "unused-awaitable",       # 未使用的 awaitable
    "redundant-self",         # 冗余的 self 类型
]

# 错误报告配置
show_error_codes = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true

# 性能优化
cache_dir = ".mypy_cache"
incremental = true

# 排除目录
# 教学代码（solutions / exercises / examples / tests / benchmarks / data）大量
# 是动态类型演示、TODO 模板、脚本式 demo，不适用 strict 类型检查；只对真正
# 的"工程代码"（projects/.../src、extensions、stage*/lessons/L**/src 等）
# 跑 strict。命中需求时通过具体 override 重新启用。
exclude = [
    "^_archive/",
    "^build/",
    "^dist/",
    "^scaffolds/",           # 实验性脚手架代码，类型检查豁免
    "^scripts/",              # 教学辅助脚本豁免（未做严格类型注解）
    "^compare-source/",        # 临时下载的 GitHub 仓库，不参与检查
    # Stage 0-9 教学代码豁免（legacy 模式，保留兼容性）
    "^stage[0-9].*/lessons/L[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary|taskmaster)(/|$)",
    "^stage[0-9].*/lessons/L[0-9]+[^/]*/(verify\\.py|verify_env\\.py|demo-docker)(/|$)",  # 验证脚本豁免
    "^stage[0-9].*/lessons/L[0-9]+[^/]*/report\\.py$",  # 报告脚本豁免
    "^stage[0-9][^/]*/tests(/|$)",
    # Stage A/K/M/P/R 教学代码豁免（新模式，支持字母前缀）
    "^stageA-ai-enterprise/lessons/A[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary)(/|$)",
    "^stageK-devops/lessons/K[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary)(/|$)",
    "^stageM-enterprise/lessons/M[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary)(/|$)",
    "^stageP-web-scraping/lessons/P[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary)(/|$)",
    "^stageR-frontier/lessons/R[0-9]+[^/]*/(solutions|exercises|examples|tests|benchmarks|data|demos|project|projects|supplementary)(/|$)",
    "^projects/[^/]+/(tests|skeleton)(/|$)",
    "^stage[0-9].*/projects/[^/]+/tests(/|$)",
    "^extensions/.*/(tests|exercises|solutions)(/|$)",
    # 教学辅助脚本 / 验证脚本未做严格类型注解；mkdocs_hooks.py 等构建关键
    # 文件单独 include（命名不在下面这份豁免列表里）。
    "^scripts/quality/",      # 质量扫描脚本豁免
    "^scripts/(analyze_cleanup|audit_markdown|lesson_md_analyzer|refactor_courses|refactor_lesson_docs|validate_lesson_format|verify_course_mapping)\\.py$",
    "/conftest\\.py$",
    ".*/__pycache__/",
]

# 🔧 第三方库配置（无类型存根的库）
# 只列**当前实际被工程代码（非 lesson）import 且缺类型 stub**的库；其他
# 第三方库已装好类型或上游自带 stub，不需要 override。删除 unused override
# 让 `mypy .` 输出干净。
[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
]
ignore_missing_imports = true

# FastAPI 路由装饰器 (@router.get / @app.get) 在某些版本下被 mypy 视为
# untyped decorator（路由函数返回类型在 FastAPI typing 模型中信息不足以
# 让装饰器透传 inner func 类型）。这是上游已知问题；FastAPI 路由层不强制
# 此项检查（仍保留其他 strict 规则）。
#
# projects/02-ai-fullstack-capstone 包名以 "02-" 开头不能作为 mypy module
# 模式，改用每个文件顶部的 # mypy: disable-error-code="untyped-decorator"。

# 注：教学代码（lessons/<>/solutions, exercises 等）通过上方 [tool.mypy].exclude
# 路径排除，不再用 module pattern 覆盖（旧写法 "lessons.*.solutions" 永远命不
# 中实际目录结构 stage{N}/lessons/L{XX}/solutions）。

# ============================================================================
# Pytest 配置 - 测试框架
# ============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "stage0-python-basics",
    "stage1-python-intermediate",
    "stage2-engineering",
    "stage3-web-basics",
    "stage4-web-advanced",
    "stage5-data-engineering",
    "stage6-ai-agent",
]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: 慢速测试 (运行时间 >1s)",
    "integration: 集成测试 (需要外部服务)",
    "unit: 单元测试 (快速、隔离)",
    "benchmark: 性能基准测试",
    "smoke: 冒烟测试 (关键路径快速验证)",
]
norecursedirs = [
    "skeleton",
    "*/skeleton",
    "skeleton/*",
    ".venv",
    ".git",
    "__pycache__",
    "site",
    "build",
    "dist",
    # 归档和过渡目录：历史遗留
    "lessons-archived",
    "*/lessons-archived",
    "lessons-new",
    "*/lessons-new",
]

# 输出配置
addopts = [
    "-ra",                       # 显示所有测试摘要
    "--strict-markers",          # 严格标记检查
    "--strict-config",           # 严格配置检查
    "--showlocals",              # 失败时显示局部变量
    "--tb=short",                # 简短回溯
    "--import-mode=importlib",   # 解决 stage 间同名 test 模块碰撞
]

# 异步测试支持
asyncio_mode = "auto"

# ============================================================================
# Coverage 配置 - 覆盖率追踪
# ============================================================================

[tool.coverage.run]
branch = true
source = [
    "stage0-python-basics",
    "stage1-python-intermediate",
    "stage2-engineering",
    "stage3-web-apis-advanced",
    "stage4-data-intelligence",
    "stage5-ai-agent",
]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
    "@overload",
]

# 覆盖率目标
fail_under = 60.0  # 阶段1: 60% → 阶段2+: 80%

[tool.coverage.html]
directory = "htmlcov"
show_contexts = true

[tool.coverage.xml]
output = "coverage.xml"

# ============================================================================
# 构建系统配置
# ============================================================================

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiohttp>=3.14.1",
    "asyncpg>=0.31.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "stage0-python-basics",
    "stage1-python-intermediate",
    "stage2-engineering",
    "stage3-web-apis-advanced",
    "stage4-data-intelligence",
    "stage5-ai-agent",
]
