# Python 3.13 全栈开发课程 V4.1 - 根目录防线配置
# 🎯 运行环境: Python 3.13 (基线) / Python 3.14t (试验性补充, Free-threading)
# 🎯 交付标准: Python 3.13 (100%现代化，前沿特性全覆盖)
# 🎯 包管理器: uv (弃用pip/venv，拥抱现代化工具链)

[tool.uv.workspace]
# 🔑 Workspace 成员：所有 stage 和 projects 作为可编辑包
# 这样可以通过标准包路径导入，无需 sys.path 污染
# 📝 2026-07-30: 修复 workspace 配置与实际目录不匹配问题
members = [
    # Core 通用核心阶段
    "stage0-python-basics",
    "stage1-python-intermediate",
    "stage2-engineering",
    "stage3-web-basics",
    "stage4-web-advanced",
    "stage5-data-engineering",
    "stage6-ai-agent",
    # Specialization 垂直专精阶段
    "stageA-ai-enterprise",
    "stageK-devops",
    "stageM-enterprise",
    "stageS-web-scraping",
    "stageR-frontier",
    # Projects 综合项目
    "projects/01-web-scraper",
    "projects/02-ai-fullstack-capstone",
    "projects/03-data-intelligence-pipeline",
    "projects/04-browser-automation-e2e",
    # Extensions 扩展模块
    "extensions/multimodal-agent",
]

[project]
name = "python-fullstack-v4.1"
version = "4.1.0"
description = "Python 3.13 全栈开发课程 V4.1 - 螺旋上升架构 + 云本双轨LLM + Free-threading"
readme = "README.md"
requires-python = ">=3.13"  # 🔑 课程基线 Python 3.13+，3.14 作为试验性补充
license = { text = "MIT" }
authors = [
    { name = "Python全栈课程团队" }
]
keywords = ["python", "fullstack", "asyncio", "fastapi", "llm", "uv", "python313", "free-threading"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education :: Computer Aided Instruction (CAI)",
]

# 核心依赖（阶段1基础）
# 升级策略（Phase 3.2，2026-06-14）：
#   - 主版本号变化会带来 breaking changes 的关键库（pandas/sqlalchemy/pydantic/numpy）加上限
#   - 工具类（ruff/mypy/pytest）也加上限，避免规则突然收紧打挂教学示例
#   - 其余库保持仅有下限，让 uv resolver 选最新兼容
dependencies = [
    "aiofiles>=25.1.0,<26.0",
    "aiohttp>=3.14.0,<4.0",
    "aiosqlite>=0.22.1,<1.0",
    "anthropic>=0.111.0,<1.0",
    "asyncpg>=0.31.0,<1.0",       # 0.31 加入 Python 3.14 wheel 标记
    "beautifulsoup4>=4.12,<5.0",
    "duckdb>=1.0,<2.0",      # 1.5 已稳定，2.0 待出
    "email-validator[web]>=2.3.0",
    "httpx>=0.27.0,<1.0",      # HTTP客户端（异步爬虫项目）
    "jinja2>=3.1.6,<4.0",
    "langchain-core>=1.4.8,<1.5.0",
    "langgraph>=1.2.6",
    "lxml>=5.0,<7.0",        # 6.x 稳定；7.x 待出
    "opentelemetry-api>=1.42.1,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0,<1.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.63b1,<1.0",
    "opentelemetry-sdk>=1.42.1,<2.0",
    "pandas>=2.2,<3.0",      # 锁定 2.x 系列，3.0 有 breaking change
    "pydantic>=2.0,<3.0",    # 锁定 2.x 系列
    "pydantic-settings>=2.6.0,<3.0",  # Stage4 核心代码需要
    "pyyaml>=6.0,<7.0",
    "requests>=2.32,<3.0",
    "rich>=13.9.0,<14.0",       # 终端美化输出
    "tomli>=2.4.1,<3.0",
    "tomli-w>=1.2.0,<2.0",
    "zai-sdk>=0.2.3,<1.0",
]

# 开发依赖（分阶段按需安装）
[project.optional-dependencies]
dev = [
    # 🔧 代码质量工具（阶段1核心）
    "ruff>=0.8.0,<2.0",         # 极速Linter + Formatter
    "mypy>=1.13.0,<2.0",        # 类型检查防线（2.0 规则更严，先锁 1.x）
                                   # >=1.11.0 确保完整支持 PEP 695 新语法（type 关键字、内联泛型）
                                   # 参考: python/mypy#15238 — 1.11.0+ 才默认启用 PEP 695

    # 🧪 测试框架（阶段1引入）
    "pytest>=8.3.0,<10.0",      # 测试框架（pytest 9 是 8 的平滑后继）
    "pytest-cov>=6.0.0",        # 覆盖率报告
    "pytest-asyncio>=1.4.0",    # 异步测试支持
    "pytest-mock>=3.14.0",      # Mock工具

    # 📝 开发辅助
    "ipython>=8.29.0",          # 增强REPL
    "pre-commit>=4.0.0",        # Git钩子管理

    # 🏷️ 类型 stub（projects/ 工程代码用）
    "types-PyYAML>=6.0,<7.0",
]

# 阶段2: Web全栈
web = [
    "fastapi>=0.115.0,<1.0",     # 锁 0.x 系列，未来 1.0 时统一升级
    "uvicorn[standard]>=0.32.0,<1.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0",  # 锁 2.x
    "alembic>=1.13.0,<2.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.6.0,<3.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib>=1.7.4,<2.0",
    "bcrypt>=4.0.0,<4.3.0",       # 锁定 4.x 系列，5.0+ 与 passlib 不兼容
    "python-multipart>=0.0.9,<1.0",
    "asyncpg>=0.31.0,<1.0",            # ↑ 0.30.0
    "strawberry-graphql[fastapi]>=0.240.0,<1.0",  # GraphQL
    "playwright>=1.40.0,<2.0",        # E2E 测试
]

# 阶段3: AI与数据
ai = [
    "pandas>=2.2.0,<3.0",
    "numpy>=2.0.0,<3.0",          # 2.0+ 全面 Python 3.13/3.14 支持
    "pyarrow>=15.0.0,<26.0",       # PyArrow 后端支持
    "openai>=1.54.0,<2.0",        # 云端LLM
    "ollama>=0.3.0",              # 本地LLM (云本双轨)
