# 完整开发环境
all = [
    "python-fullstack-v4.1[dev,web,ai,deploy,docs,viz]",
]

# ============================================================================
# Ruff 配置 - Rust驱动的极速代码质量工具
# 🎯 target-version = "py313" - 前沿标准锁定Python 3.13
# ============================================================================

[tool.ruff]
target-version = "py313"  # 🔑 关键：静态检查锁定Python 3.13
line-length = 100
indent-width = 4

# 排除目录
exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "_archive",
    # 项目骨架代码：故意保留 TODO 与未使用 import，供学习者按提示填充
    "projects/*/skeleton",
    # 归档课程内容：历史遗留，暂不维护
    "stage0-python-basics/lessons-archived",
    # 包含 Markdown 代码块的示例文件：Ruff 无法解析 Shell 语法
    "stage2-engineering/lessons/L18-toolchain/examples/example_05_git_advanced.py",
    # 比较源目录：临时下载的 GitHub 仓库，不参与 CI 检查
    "compare-source",
]

[tool.ruff.lint]
# 🚨 Strict模式 - 启用关键规则集
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (import排序)
    "N",      # pep8-naming (命名规范)
    "UP",     # pyupgrade (语法现代化)
    "B",      # flake8-bugbear (反模式检测) ⭐
    "C4",     # flake8-comprehensions (推导式优化)
    "DTZ",    # flake8-datetimez (时区安全)
    "T10",    # flake8-debugger (禁止debugger)
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie (反模式简化)
    "PT",     # flake8-pytest-style (pytest规范)
    "Q",      # flake8-quotes (引号规范)
    "RSE",    # flake8-raise (异常规范)
    "RET",    # flake8-return (return规范)
    "SIM",    # flake8-simplify (代码简化)
    "ARG",    # flake8-unused-arguments (未使用参数)
    "PTH",    # flake8-use-pathlib (Path优于os.path)
    "PL",     # pylint (全面代码质量)
    "TRY",    # tryceratops (异常处理最佳实践)
    "RUF",    # ruff-specific rules

    # 🔥 类型注解强制检查（必须）
    "ANN",    # flake8-annotations (强制类型提示)
    "TCH",    # flake8-type-checking (TYPE_CHECKING 优化)
    "FA",     # flake8-future-annotations (future annotations)
]

# 🎯 精准忽略（教学项目特殊性）
ignore = [
    "E501",    # line-too-long (由line-length统一处理)
    "TRY003",  # long-exception-message (教学代码需要详细异常说明)
    "PLR0913", # too-many-arguments (某些场景合理)
    "PLR2004", # magic-value-comparison (教学示例允许魔法值)
    "D100", "D101", "D102", "D103", "D104", "D105", "D107",  # docstring要求(按需开启)
    "ANN401",  # Any 允许在特定场景（但 mypy 会严格检查）
    "COM812", "ISC001",  # 与formatter冲突的规则
    "T201",    # 允许教学演示使用 print
    "RUF001",  # 允许中文全角标点
    "RUF002",  # Docstring 中文字符
    "RUF003",  # 注释中文字符
    "RUF006",  # asyncio.create_task 未存储返回值（教学演示允许）
    "D400",    # 放宽 Docstring 格式
    "D415",    # 放宽 Docstring 格式
    "D205",    # 放宽 Docstring 格式
    "PLC0415", # 非顶层导入
]

# 🚨 拦截危险反模式（关键防线）
# B006: 可变默认参数 (如 def foo(data=[]):)
# B008: 函数调用作为默认参数 (如 def foo(now=datetime.now()):)
# B904: 裸except后未使用raise from
# B905: zip()未使用strict=True (Python 3.10+)
# TRY002: 抛出通用Exception (应使用具体异常)
# TRY300: try-except-pass反模式 (静默吞掉错误)

# 🎯 按文件定制规则
[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101",    # assert在测试中是必需的
    "PLR2004", # 测试中的魔法值可接受
    "ARG",     # 测试fixture参数未使用正常
    "ANN",     # 测试代码可放宽类型要求
    "E402",    # 测试中先 importorskip 后再 import 是合规模式
    "PT006",   # 教学测试保留字符串签名便于初学者识读
    "PT011",   # 教学测试可宽泛 pytest.raises
    "PT012",   # 异步生成器场景需在 with 内迭代
    "F841",    # 教学示例可显式保留中间结果变量
    "TRY300",  # 教学保留 try/return 结构以体现异常路径
    "TRY301",  # 教学保留 try 内 raise
    "SIM117",  # 教学双层 with 反例可读性更好
    "N802",    # 教学测试方法名可使用驼峰映射被测代码
    "N806",    # 教学测试可使用大写常量
    "PLR0915", # 教学集成测试可较长
]
"**/test_*.py" = [
    "S101", "PLR2004", "ARG", "ANN",
    "E402", "PT006", "PT011", "PT012",
    "F841", "TRY300", "TRY301", "SIM117",
