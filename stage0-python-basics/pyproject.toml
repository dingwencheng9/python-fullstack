# Python 基础 - 虚拟容器
# 不含 [build-system]，不是可安装包

[project]
name = "stage0-python-basics"
version = "0.1.0"
description = "Python 3.13 全栈课程 - Python 基础"
requires-python = ">=3.13"

# 依赖从根 pyproject.toml 继承
dependencies = []

# 仅工具配置，无 [build-system]（stage 是虚拟容器）
[tool.ruff]
target-version = "py313"
line-length = 150
